name: Publish index

on:
  push:
    branches: [main]
    # paths:
    #   - 'packages/**'
    #   - 'schema/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == (vars.CANONICAL_REPO || 'phpvms/addon-registry')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up env
        uses: ./.github/actions/setup-bot-env
        with:
          generate-token: 'false'

      - name: Build & upload index, refresh worker cache
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          WORKER_REFRESH_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: npm run -s build-index
