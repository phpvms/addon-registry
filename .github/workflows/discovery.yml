name: Discovery

# Version discovery via three triggers:
#   - schedule: cron every 6h
#   - push to main: catches drift after merges
#   - repository_dispatch: targeted run for the named addon (event from worker)

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'packages/**/*.yml'
  repository_dispatch:
    types: [addon-released]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == (vars.CANONICAL_REPO || 'phpvms/addon-registry')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up bot env (App token)
        id: env
        uses: ./.github/actions/setup-bot-env
        with:
          generate-token: 'true'
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run discovery
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.env.outputs.app-token }}
          DISPATCH_NAME: ${{ github.event.client_payload.name }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            npm run -s discovery -- --dispatch --name "$DISPATCH_NAME" ${DISPATCH_TAG:+--tag "$DISPATCH_TAG"}
          elif [ "$EVENT_NAME" = "push" ]; then
            npm run -s discovery -- --merge
          else
            npm run -s discovery -- --sweep
          fi
