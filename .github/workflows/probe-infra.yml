name: Probe infra

# One-shot smoke test for sections 9 & 10 of bootstrap-addon-registry:
# verifies the App token mints, R2 is reachable for write+read+delete,
# and the worker refresh endpoint accepts the shared secret. Intended
# to be deleted once the registry is live.

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: 'Worker base URL (e.g. https://addon-registry-api.example.workers.dev). Leave blank to skip worker probe.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bot-env
        id: env
        with:
          generate-token: 'true'
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Probe App token (read repo metadata)
        env:
          GH_TOKEN: ${{ steps.env.outputs.app-token }}
        run: |
          set -euo pipefail
          echo "== App token minted, hitting /repos/${{ github.repository }} =="
          gh api "/repos/${{ github.repository }}" --jq '{full_name, private, default_branch}'
          echo "== App token can list PRs =="
          gh api "/repos/${{ github.repository }}/pulls?state=all&per_page=1" --jq 'length'

      - name: Probe R2 (PUT, GET, DELETE a tiny object)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/probe-r2.mjs

      - name: Probe worker refresh
        if: inputs.worker_url != ''
        env:
          WORKER_URL: ${{ inputs.worker_url }}
          WORKER_REFRESH_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          set -euo pipefail
          echo "== POST $WORKER_URL/v1/internal/refresh =="
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -X POST "$WORKER_URL/v1/internal/refresh" \
            -H "Authorization: Bearer $WORKER_REFRESH_SECRET" \
            -H 'Content-Type: application/json' \
            -d '{"reason":"probe"}')
          echo "HTTP $code"
          cat /tmp/body || true
          echo
          if [[ "$code" != "204" && "$code" != "200" ]]; then
            echo "Worker did not return 2xx" >&2
            exit 1
          fi
