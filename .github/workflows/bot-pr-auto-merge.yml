name: Bot PR auto-merge

# Self-merge bot/* PRs once their required checks pass and a tamper
# check confirms every commit on the branch was authored by the
# registry's GitHub App. We use a `workflow_run` trigger (rather than
# repo-level auto-merge or check_suite) so the merge logic runs with
# `pull-requests: write` from the App installation token, and so it
# only fires after our specific gating workflows complete.
#
# Why not GitHub's native auto-merge? It requires `allow_auto_merge`
# at the repo level. We prefer keeping the merge policy in code where
# it can encode the tamper check; otherwise a human push to a bot
# branch would slip through unnoticed.

on:
  workflow_run:
    workflows: ['CI', 'Validate PR']
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Per head SHA: each successful gating workflow run for the same
  # commit triggers this workflow once; serialize so two runs don't
  # race to call pulls.merge.
  group: bot-pr-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && startsWith(github.event.workflow_run.head_branch, 'bot/')
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.repository == (vars.CANONICAL_REPO || 'phpvms/addon-registry')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up bot env (App token)
        id: env
        uses: ./.github/actions/setup-bot-env
        with:
          generate-token: 'true'
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Self-merge bot PR if eligible
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          APP_TOKEN: ${{ steps.env.outputs.app-token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: npm run -s merge-bot-pr
